- name: Configure IPv6
  hosts: all
  remote_user: k3s
  become: true

  tasks:
    # Configure static IPv6 networking using NetworkManager via nmcli
    - name: Set IPv6 to manual and assign static address
      community.general.nmcli:
        type: ethernet
        conn_name: "{{ ipv6_conn_name }}"
        autoconnect: true
        method6: manual
        ip6: ["{{ ipv6_address }}"]
        gw6: "{{ ipv6_gateway }}"
        dns6: "{{ ipv6_dns }}"
        state: present
      notify: Restart NetworkManager

    # Enable IPv6 Forwarding
    - name: Create a sysctl config file for IPv6 forwarding
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/98-ipv6.conf"
        content: "net.ipv6.conf.all.forwarding = 1\n"
        owner: root
        group: root
        mode: "0644"
      notify: Reload sysctl

    - name: Apply network changes now
      ansible.builtin.meta: flush_handlers

    - name: Wait for connection after restart
      ansible.builtin.wait_for_connection:
        timeout: 120

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Restart NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        state: restarted
